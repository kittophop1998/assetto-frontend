<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Modern Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f3f0ff; /* ม่วงอ่อนมากสำหรับพื้นหลังหลัก */
        }
        .login-card {
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.1);
        }
        .purple-gradient {
            background: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login Container -->
    <div class="login-card bg-white rounded-3xl overflow-hidden flex flex-col md:flex-row w-full max-w-4xl min-h-[500px]">
        
        <!-- Left Side: Logo/Icon Section -->
        <div class="purple-gradient md:w-1/2 flex flex-col items-center justify-center p-12 text-center text-purple-900">
            <div class="bg-white/50 p-6 rounded-full mb-6">
                <!-- Inline SVG Icon (แทน Logo) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-purple-600">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-2">ยินดีต้อนรับ</h1>
            <p class="text-purple-800/70 font-light">จัดการทุกอย่างได้ง่ายขึ้นผ่านระบบของเรา</p>
        </div>

        <!-- Right Side: Login Form -->
        <div class="md:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-white">
            <div class="mb-10">
                <h2 class="text-2xl font-medium text-gray-800">เข้าสู่ระบบ</h2>
                <p class="text-gray-400 text-sm mt-1">กรุณากรอกข้อมูลเพื่อเริ่มต้นใช้งาน</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-600 mb-2">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="username" name="username" required
                        class="w-full px-4 py-3 rounded-xl border border-purple-100 focus:outline-none focus:ring-2 focus:ring-purple-300 focus:border-transparent transition-all bg-purple-50/30"
                        placeholder="Username">
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-600 mb-2">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 rounded-xl border border-purple-100 focus:outline-none focus:ring-2 focus:ring-purple-300 focus:border-transparent transition-all bg-purple-50/30"
                        placeholder="••••••••">
                </div>

                <!-- Login Button -->
                <div class="pt-4">
                    <button type="submit" 
                        class="w-full bg-purple-500 hover:bg-purple-600 text-white font-medium py-3 rounded-xl shadow-lg shadow-purple-200 transition-all active:scale-[0.98]">
                        เข้าสู่ระบบ
                    </button>
                </div>
            </form>

            <!-- Success Message Box (Hidden by default) -->
            <div id="messageBox" class="hidden mt-6 p-4 rounded-xl text-center text-sm"></div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageBox = document.getElementById('messageBox');
            const username = document.getElementById('username').value;
            
            // จำลองการตรวจสอบข้อมูล
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            
            if (username) {
                messageBox.textContent = 'กำลังเข้าสู่ระบบ...';
                messageBox.classList.add('bg-green-100', 'text-green-700');
                
                // หลังจาก 1.5 วินาที
                setTimeout(() => {
                    messageBox.textContent = 'ยินดีต้อนรับคุณ ' + username;
                }, 1500);
            }
        });
    </script>
</body>
</html>
